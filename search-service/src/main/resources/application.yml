server:
  port: 1235  # 임시
  forward-headers-strategy: framework

spring:
  application:
    name: "search-service"

  config:
    import: optional:file:search-service/.env[.properties]

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:localhost:9200}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all # (선택) 발행 보장 수준 (0, 1, all)
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: traveler-group # 소비자 그룹 ID
      auto-offset-reset: earliest # 오프셋 정보가 없을 때 시작 위치 (latest, earliest)
      enable-auto-commit: false # 자동 커밋 여부
    listener:
      concurrency: 3 # 리스너의 병렬 처리 수준 (보통 파티션 개수와 맞춤)
      ack-mode: manual_immediate # 메시지 수신 확인 모드 (manual_immediate: 로직 완료 후 즉시 커밋)

swagger:
  info:
    paths-to-match:
      - "/api/v1/search/**"

springdoc:
  api-docs:
    path: /api/v1/search/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.elasticsearch.client: TRACE

app:
  kafka:
    topics:
      post-events: "post-service.post.events"
      post-commands: "post-service.post.commands"
      comment-events: "post-service.comment.events"
      like-events: "post-service.like.events"
  elasticsearch:
    indices:
      post: "posts"
      comment: "comments"
      like: "likes"
